<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="positioning.css">
</head>

<body>
    <header class="header">
        <div class="logo">TCom</div>
        <div class="nav_container">
            <nav class="main_nav">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Services</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="sidebar">
                <h3>Sidebar</h3>
                <ul>
                    <li>Danh mục 1</li>
                    <li>Danh mục 2</li>
                    <li>Danh mục 3</li>
                </ul>
            </div>

           
            <div class="content">
                <h2>Sản phẩm</h2>
                
                <div class="product-list">
                   
                    <div class="product-card">
                        <div class="product-img">📱</div>
                        <h3>Điện thoại ABC</h3>
                        <p>5.000.000đ</p>
                        <div class="hot-badge">HOT</div>
                    </div>

                   
                    <div class="product-card">
                        <div class="product-img">💻</div>
                        <h3>Laptop XYZ</h3>
                        <p>15.000.000đ</p>
                        <div class="hot-badge">HOT</div>
                    </div>

                    
                    <div class="product-card">
                        <div class="product-img">🎧</div>
                        <h3>Tai nghe</h3>
                        <p>500.000đ</p>
                        <div class="hot-badge">HOT</div>
                    </div>

                    
                    <div class="product-card">
                        <div class="product-img">⌚</div>
                        <h3>Đồng hồ</h3>
                        <p>2.000.000đ</p>
                        <div class="hot-badge">HOT</div>
                    </div>
                </div>
            </div>
    </div>


    <button class="scroll-top" id="scrollBtn">↑</button>



    </main>

</html>
