<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello JavaScript</title>
</head>

<body>
    <h1>Bài tập đầu tiên với JavaScript</h1>
    <p>Mở Console (F12 → Console) để xem kết quả</p>

    <script>
        console.log("Xin chào thế giới!");
        console.log("Tôi đang học JavaScript");
        console.log(2026);

        //let
        let name = "Minh Triet";
        let age = 21;
        let major = "Software engineering";

        console.log("Name: ", name);
        console.log("Age: ", age);
        console.log("Major: ", major);

        name = "Le Minh Triet";
        console.log("Name: ", name);

        //const
        const hoTen = "Le Minh Triet";
        console.log("Ho ten: ", hoTen);

        //var
        var monHoc = "CSE391";
        console.log("Môn:", monHoc);

        //DATA TYPE
        //string
        let hoTen1 = "Nguyễn Văn A";
        let diaChi = 'Hà Nội';
        let loiChao = `Xin chào ${hoTen}`;

        console.log(typeof hoTen1);
        console.log(loiChao);

        //number
        let soNguyen = 42;
        let soThuc = 3.14;
        let am = -10;
        let voCuc = Infinity;

        console.log(typeof soNguyen);

        //boolean
        let laTrue = true;
        let laFalse = false;

        console.log(typeof laTrue);

        //null & undefined
        let giaTriNull = null;          // "không có gì" (cố tình)
        let chuaGanGiaTri;              // undefined (chưa gán)

        console.log(typeof giaTriNull);   // "object" (bug nổi tiếng của JS!)
        console.log(typeof chuaGanGiaTri); // "undefined"

        //check data types
        console.log("42 là:", typeof 42);          // number
        console.log("'42' là:", typeof "42");      // string
        console.log("true là:", typeof true);      // boolean

        //Template Literal
        let sanPham = "Laptop";
        let soLuong = 2;
        let donGia = 15000000;

        let announcement = `
        =========HÓA ĐƠN=========
        Tên sản phẩm: ${sanPham}
        Số lượng: ${soLuong}
        Đơn giá: ${donGia}
        Tổng tiền: ${soLuong * donGia}
        `
        console.log(announcement);

        //
        const PI = 3.14159;
        let banKinh = 5;

        console.log("Diện tích: ",PI * (banKinh * banKinh));
        console.log("Chu vi: ",2 * PI * banKinh);

    </script>
</body>

</html>
