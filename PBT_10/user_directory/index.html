<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory (CRUD App)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Quản Lý Thành Viên</h1>
            <button id="openCreateModalBtn" class="btn btn-primary">+ Thêm thành viên</button>
        </header>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên hoặc email...">
        </section>

        <main id="userGrid" class="user-grid">
            </main>
    </div>

    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn">&times;</button>
            <h3 id="modalTitle">Thêm Thành Viên Mới</h3>
            
            <form id="userForm">
                <input type="hidden" id="userIdInput">
                
                <div class="form-group">
                    <label for="nameInput">Họ và tên</label>
                    <input type="text" id="nameInput" required placeholder="Ví dụ: Nguyễn Văn A">
                </div>

                <div class="form-group">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" required placeholder="name@company.com">
                </div>

                <div class="form-group">
                    <label for="phoneInput">Số điện thoại</label>
                    <input type="text" id="phoneInput" required placeholder="Ví dụ: 0901-234-567">
                </div>

                <div class="form-group">
                    <label for="companyInput">Tên công ty</label>
                    <input type="text" id="companyInput" required placeholder="Ví dụ: TechCorp">
                </div>

                <button type="submit" id="saveBtn" class="btn btn-primary btn-block">Lưu lại</button>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
