<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-API Data Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div>
                <h1>Hệ Thống Trung Tâm Tổng Hợp</h1>
                <p id="fetchTimer" class="fetch-timer">Đang khởi tạo ứng dụng...</p>
            </div>
            <button id="refreshAllBtn" class="btn btn-primary">🔄 Làm mới tất cả</button>
        </header>

        <main class="dashboard-grid">
            
            <section id="widget-0" class="widget-card">
                <h3 class="widget-title">⛅ Thời Tiết Hiện Tại</h3>
                <div class="widget-body"></div>
            </section>

            <section id="widget-1" class="widget-card">
                <h3 class="widget-title">🌍 Khám Phá Quốc Gia</h3>
                <div class="widget-body"></div>
            </section>

            <section id="widget-2" class="widget-card">
                <h3 class="widget-title">👥 Nhân Viên Tiêu Biểu</h3>
                <div class="widget-body"></div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
