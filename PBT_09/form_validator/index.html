<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="username">Họ và tên</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Nhập từ 2 - 50 ký tự">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="example@domain.com">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Nhập mật khẩu an toàn">
                    <span class="status-icon"></span>
                </div>
                <div class="strength-meter">
                    <div id="strengthBar" class="strength-bar"></div>
                </div>
                <span id="strengthText" class="strength-text">Chưa nhập mật khẩu</span>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu phía trên">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <div class="input-wrapper">
                    <input type="text" id="phone" placeholder="Ví dụ: 0901-234-567" maxlength="12">
                    <span class="status-icon"></span>
                </div>
                <small class="error-msg"></small>
            </div>

            <button type="submit" id="submitBtn" disabled>Đăng ký</button>
        </form>
    </div>

    <div id="modalContainer"></div>

    <script src="app.js"></script>
</body>
</html>
